<title>وقت فراغي | مجتبى البشراوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #141418;
  --surface: #1D1D23;
  --raised: #26262E;
  --line: #2F2F3A;
  --ink: #F2F2F5;
  --muted: #A2A2B0;
  --accent: #3D8BFF;
  --accent-tint: #1B2C4A;
  --font: "Rubik", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 96px); scroll-behavior: smooth; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.9; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 24px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Nav (floating pill) ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 14px 0 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 62px; padding-inline: 12px 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
.logo img { width: 42px; height: 42px; border-radius: 50%; background: #fff; object-fit: cover; }
.logo b { color: var(--accent); font-weight: 700; }
.links { display: flex; gap: 6px; list-style: none; padding: 0; }
.links a { display: block; padding: 6px 16px; border-radius: 999px; color: var(--muted); font-size: 15px; font-weight: 500; transition: background .2s, color .2s; }
.links a:hover { background: var(--raised); color: var(--ink); }
.burger { display: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--raised); color: var(--ink); cursor: pointer; place-items: center; }
.menu { display: none; margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 10px; }
.menu a { display: block; padding: 12px 18px; border-radius: 14px; color: var(--ink); }
.menu a:hover { background: var(--raised); }
.menu.open { display: block; }
@media (max-width: 820px) { .links { display: none; } .burger { display: grid; } }

/* ---------- Hero ---------- */
.hero { padding: 72px 0 96px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: center; }
.hi { font-size: clamp(24px, 3.4vw, 34px); font-weight: 600; }
.hero h1 { font-size: clamp(44px, 8vw, 88px); font-weight: 700; line-height: 1.3; margin-top: 2px; }
.typed { margin-top: 6px; font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; }
.typed span { color: var(--accent); }
.typed i { display: inline-block; width: 3px; height: 1em; margin-inline-start: 4px; background: var(--accent); vertical-align: -0.12em; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.hero p { max-width: 52ch; margin-top: 22px; color: var(--muted); font-size: 17.5px; }
.social { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.social a { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; transition: background .2s, color .2s; }
.social a:hover { background: var(--accent); color: #fff; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 30px; border-radius: 999px; font-weight: 600; font-size: 15.5px; border: 2px solid var(--accent); transition: background .2s, color .2s, transform .2s; }
.btn.fill { background: var(--accent); color: #fff; }
.btn.line { color: var(--accent); }
.btn.line:hover { background: var(--accent); color: #fff; }
.btn:hover { transform: translateY(-2px); }
.photo-wrap { display: grid; place-items: center; }
.avatar { width: clamp(240px, 30vw, 380px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 46px rgba(61,139,255,.45); overflow: hidden; background: var(--raised); display: grid; place-items: center; color: var(--muted); text-align: center; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar svg { width: 84px; height: 84px; stroke: currentColor; fill: none; stroke-width: 1.2; stroke-linecap: round; }
.avatar small { display: block; font-size: 14px; margin-top: 4px; }
.hero-img { width: clamp(250px, 31vw, 400px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; filter: drop-shadow(0 0 30px rgba(61,139,255,.5)); }
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 40px; }
  .photo-wrap { order: -1; }
}

/* ---------- Section heads ---------- */
section { padding: 84px 0; }
.sec-head { margin-bottom: 44px; }
.sec-head h2 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; line-height: 1.4; }
.sec-head h2 b { color: var(--accent); font-weight: 700; }
.sec-head p { color: var(--muted); margin-top: 4px; max-width: 48ch; }

/* ---------- Placeholder photo ---------- */
.ph { background: var(--raised); color: var(--muted); display: grid; place-content: center; justify-items: center; gap: 6px; font-size: 14px; text-align: center; }
.ph svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Journey timeline ---------- */
.tl { position: relative; }
.tl-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: var(--line); border-radius: 3px; }
.tl-fill { width: 100%; height: 0; background: var(--accent); border-radius: 3px; }
.tl-item { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: 72px; padding-bottom: 56px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item .tl-card { grid-column: 1; }
.tl-item:nth-child(even) .tl-card { grid-column: 2; }
.tl-node { position: absolute; top: 34px; left: 50%; width: 22px; height: 22px; transform: translateX(-50%); border-radius: 50%; background: var(--bg); border: 3px solid var(--line); transition: background .3s, border-color .3s, box-shadow .3s; z-index: 1; }
.tl-item.on .tl-node { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 7px rgba(61,139,255,.22); }
.tl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 14px 14px 26px; transition: border-color .3s; }
.tl-item.on .tl-card { border-color: #2B4F8A; }
.tl-card .ph { aspect-ratio: 16/10; border-radius: 16px; }
.tl-card .pic { position: relative; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background: var(--raised); }
.tl-card .pic img.logo-b { position: absolute; bottom: 12px; inset-inline-start: 12px; width: 56px; height: 56px; border-radius: 14px; background: #fff; padding: 5px; object-fit: contain; }
.soon { position: absolute; top: 12px; inset-inline-end: 12px; background: var(--accent); color: #fff; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; }
.tl-card.nopic .txt { padding-top: 14px; }
.tl-card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tl-card .txt { padding: 20px 12px 0; }
.year { display: inline-block; padding: 1px 16px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); font-weight: 600; font-size: 15px; }
.tl-card h3 { font-size: 22px; font-weight: 600; line-height: 1.6; margin-top: 8px; }
.tl-card p { color: var(--muted); font-size: 16px; margin-top: 4px; }
.tl-item.now .tl-card { background: var(--accent); border-color: var(--accent); }
.tl-item.now .year { background: rgba(255,255,255,.2); color: #fff; }
.tl-item.now p { color: rgba(255,255,255,.9); }
.tl-item.now .ph { background: #2B6BEA; color: #fff; }
@media (max-width: 760px) {
  .tl-line { left: auto; right: 13px; transform: none; }
  .tl-node { left: auto; right: 4px; transform: none; }
  .tl-item { grid-template-columns: 1fr; padding-right: 44px; }
  .tl-item .tl-card, .tl-item:nth-child(even) .tl-card { grid-column: 1; }
}

/* ---------- About (bento) ---------- */
.bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(150px, auto); gap: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px; position: relative; overflow: hidden; }
.tile.photo { padding: 0; }
.tile.photo .ph { position: absolute; inset: 0; }
.tile.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile.photo figcaption { position: absolute; bottom: 14px; inset-inline-start: 14px; background: var(--bg); padding: 2px 16px; border-radius: 999px; font-size: 14px; }
.tile h3 { font-size: 15px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
.tile p { color: var(--muted); font-size: 16.5px; }
.t-photo-big { grid-column: span 2; grid-row: span 2; aspect-ratio: 4 / 3; }
.t-bio { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; justify-content: center; }
.t-tools { grid-column: span 2; }
.t-photo-s { grid-column: span 1; aspect-ratio: 4 / 3; }
.t-hobby { grid-column: span 2; }
.t-fact { grid-column: span 3; background: var(--accent); border-color: var(--accent); }
.t-fact h3 { color: rgba(255,255,255,.85); }
.t-fact p { color: #fff; font-size: 20px; font-weight: 500; line-height: 1.8; }
.t-photo-s2 { grid-column: span 1; aspect-ratio: 4 / 3; }
.big { font-size: 26px; font-weight: 600; line-height: 1.5; }
.big.sm { font-size: 19px; line-height: 1.7; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-inline-end: 8px; animation: blink 2.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 3px 16px; border-radius: 999px; background: var(--raised); font-size: 15px; }
@media (max-width: 820px) {
  .bento { grid-template-columns: 1fr 1fr; }
  .t-photo-big, .t-bio, .t-tools, .t-fact, .t-hobby, .t-photo-s { grid-column: span 2; }
  .t-photo-big { grid-row: span 1; }
  .t-bio { grid-row: span 1; }
}

/* ---------- Services (soft cards) ---------- */
.sec-head.center { text-align: center; }
.sec-head.center p { margin-inline: auto; }
.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.svc { background: var(--surface); border-radius: 22px; padding: 36px 28px; text-align: center; transition: background .25s, transform .25s; }
.svc:hover { background: var(--raised); transform: translateY(-4px); }
.svc .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--accent-tint); color: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; }
.svc h3 { color: var(--accent); font-size: 20px; font-weight: 600; }
.svc p { color: var(--muted); font-size: 16px; margin-top: 6px; }
@media (max-width: 760px) { .svc-grid { grid-template-columns: 1fr; } }

/* ---------- Skill rings ---------- */
.skills { margin-top: 18px; background: var(--surface); border-radius: 24px; padding: 32px 24px 36px; }
.skills h3 { text-align: center; font-size: 20px; font-weight: 600; color: var(--accent); margin-bottom: 28px; }
.rings { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
.ring { width: 132px; text-align: center; }
.ring .rc { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; }
.ring circle { fill: none; stroke-width: 9; }
.ring .trk { stroke: var(--raised); }
.ring .prg { stroke: var(--accent); transition: stroke-dashoffset 1.3s ease; }
.ring .rc b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 600; }
.ring > span { display: block; margin-top: 10px; font-size: 15px; color: var(--muted); line-height: 1.5; }
@media (max-width: 520px) { .ring { width: 112px; } .ring .rc { width: 112px; height: 112px; } .rings { gap: 18px; } }

/* contact on banner */
.contact { background-color: #0B2A5E; background-size: cover; background-position: center; border-color: #1D4A94; color: #fff; }
.contact p { color: rgba(255,255,255,.88); }
.contact h2 b { color: #8DBBFF; }
.contact .btn.fill { background: #fff; border-color: #fff; color: #0B2A5E; }
.contact .btn.line { color: #fff; border-color: #fff; }
.contact .btn.line:hover { background: #fff; color: #0B2A5E; }

/* ---------- Works ---------- */
.works-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
.works-top .sec-head { margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font: inherit; font-size: 15px; font-weight: 500; background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 22px; cursor: pointer; transition: background .2s, color .2s; }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 12px 12px 22px; transition: border-color .25s, transform .25s; display: block; }
.card:hover { border-color: var(--accent); transform: translateY(-4px); }
.card[hidden] { display: none; }
.thumb { aspect-ratio: 4/3; border-radius: 16px; background: var(--raised); color: var(--accent); display: grid; place-items: center; position: relative; }
.thumb svg { width: 50px; height: 50px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: 12px; inset-inline-start: 12px; font-size: 13px; padding: 0 14px; border-radius: 999px; background: var(--bg); color: var(--ink); }
.card .body { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 10px 0; }
.card h3 { font-size: 18px; font-weight: 600; line-height: 1.6; }
.card p { color: var(--muted); font-size: 15px; line-height: 1.7; }
.go { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--muted); transition: all .25s; }
.card:hover .go { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- GAT versions ---------- */
.vstep { position: relative; display: flex; justify-content: space-between; margin-bottom: 28px; }
.vline { position: absolute; top: 13px; inset-inline: 22px; height: 3px; background: var(--line); border-radius: 3px; }
.vfill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
.vbtn { position: relative; z-index: 1; display: grid; justify-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; padding: 0 6px; }
.vbtn i { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 3px solid var(--line); transition: background .3s, border-color .3s, box-shadow .3s; }
.vbtn.past i { background: var(--accent); border-color: var(--accent); }
.vbtn[aria-selected="true"] { color: var(--ink); }
.vbtn[aria-selected="true"] i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 7px rgba(61,139,255,.22); }
.vpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(24px, 5vw, 40px); display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
.vpanel h3 { font-size: 24px; font-weight: 600; line-height: 1.6; margin-top: 8px; }
.vpanel ul { list-style: none; padding: 0; margin-top: 14px; display: grid; gap: 8px; }
.vpanel li { position: relative; padding-inline-start: 26px; color: var(--muted); font-size: 16.5px; }
.vpanel li::before { content: ""; position: absolute; inset-inline-start: 0; top: .72em; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
@media (max-width: 700px) { .vpanel { grid-template-columns: 1fr; } }

.story { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 56px; }
.story .svc { text-align: start; padding: 30px; }
.story .svc:hover { transform: none; }
.story .svc.wide { grid-column: span 2; }
.story .svc h3 { margin-bottom: 8px; }
.story .svc p { margin-top: 0; }
.dots { list-style: none; padding: 0; display: grid; gap: 10px; margin-top: 12px; }
.dots li { position: relative; padding-inline-start: 24px; color: var(--muted); font-size: 16.5px; }
.dots li::before { content: ""; position: absolute; inset-inline-start: 0; top: .72em; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.dots b { color: var(--ink); font-weight: 600; }
.sub-h { font-size: 24px; font-weight: 600; margin-bottom: 22px; }
button.btn { font: inherit; font-weight: 600; cursor: pointer; background: none; }
@media (max-width: 760px) { .story { grid-template-columns: 1fr; } .story .svc.wide { grid-column: span 1; } }

/* ---------- Leisure ---------- */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; transition: border-color .25s, transform .25s; }
.game:hover { border-color: var(--accent); transform: translateY(-3px); }
.gcover { position: relative; aspect-ratio: 460 / 215; background: var(--raised); color: var(--accent); display: grid; place-items: center; }
.gcover svg { width: 44px; height: 44px; }
.gcover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gcover img.contain { object-fit: contain; padding: 14px; background: var(--raised); }
.gbody { padding: 14px 20px 18px; }
.game h4 { font-size: 18px; font-weight: 600; line-height: 1.5; }
.game p { color: var(--muted); font-size: 14.5px; line-height: 1.6; }
.t-photo-big img.fg { inset: auto; top: 50%; left: 50%; width: auto; height: 90%; aspect-ratio: 1; transform: translate(-50%, -50%); object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0 24px rgba(61,139,255,.45)); }
.profiles { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.profiles[hidden] { display: none; }
.wtools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.wf { display: flex; flex-wrap: wrap; gap: 8px; }
.wf button { font: inherit; font-size: 15px; font-weight: 500; background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 22px; cursor: pointer; transition: background .2s, color .2s; }
.wf button:hover { color: var(--ink); }
.wf button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.wsum { color: var(--muted); font-size: 15px; }
.watch { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.w { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: start; }
.poster { position: relative; width: 88px; aspect-ratio: 2 / 3; border-radius: 14px; background: var(--raised); color: var(--muted); display: grid; place-items: center; overflow: hidden; }
.poster svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.w h4 { font-size: 17.5px; font-weight: 600; line-height: 1.6; }
.wmeta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.wmeta span { font-size: 13px; padding: 0 12px; border-radius: 999px; background: var(--raised); color: var(--muted); }
.wmeta .yr { background: var(--accent-tint); color: var(--accent); }
.wmeta .demo { background: none; border: 1px dashed var(--line); }
.pbar { height: 7px; border-radius: 7px; background: var(--raised); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 7px; transition: width .8s ease; }
.wtxt { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 14.5px; color: var(--muted); }
.wtxt b { color: var(--ink); font-weight: 600; }
.wsub { color: var(--muted); font-size: 13.5px; }
.newb { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 0 14px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600; }
.newb::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 2s ease-in-out infinite; }
.wnote { color: var(--muted); font-size: 14.5px; margin-top: 18px; }
.wtools[hidden], .finished[hidden] { display: none; }
.finished { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 22px; color: var(--muted); font-size: 15px; }
.finished b { font-weight: 500; margin-inline-end: 4px; }
.finished .c { background: var(--raised); color: var(--ink); padding: 2px 14px; border-radius: 999px; font-size: 14.5px; }

/* ---------- Contact ---------- */
.contact { border-radius: 32px; background: var(--surface); border: 1px solid var(--line); padding: clamp(32px, 7vw, 72px); display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: center; }
.contact h2 { font-size: clamp(28px, 4.6vw, 46px); font-weight: 700; line-height: 1.5; }
.contact h2 b { color: var(--accent); }
.contact p { color: var(--muted); margin-top: 8px; }
.contact .side { display: grid; gap: 12px; }
.contact .btn { justify-content: center; }
@media (max-width: 820px) { .contact { grid-template-columns: 1fr; } }

footer { padding: 32px 0 56px; color: var(--muted); font-size: 14.5px; }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Leisure page ---------- */
.hero-lite { padding: 56px 0 24px; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin-bottom: 18px; transition: color .2s; }
.back:hover { color: var(--accent); }
.hero-lite h1 { font-size: clamp(44px, 8vw, 84px); font-weight: 700; line-height: 1.3; }
.hero-lite h1 b { color: var(--accent); }
.hero-lite p { color: var(--muted); font-size: 18px; margin-top: 8px; max-width: 52ch; }
.wsub2 { color: var(--muted); font-size: 14px; margin: -4px 0 10px; }
.page-sec { padding: 48px 0; }
</style>

  var gameIcon = '<svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4M16 11.5h.01M18.5 13.5h.01"/></svg>';
  function renderGames() {
    var el = document.getElementById('games');
    el.innerHTML = games.map(function (x) {
      var cov = x.cover || (x.steam ? 'https://cdn.akamai.steamstatic.com/steam/apps/' + x.steam + '/header.jpg' : '');
      return '<div class="game"><div class="gcover">' + gameIcon + (cov ? '<img src="' + cov + '" alt="" referrerpolicy="no-referrer"' + (x.steam ? '' : ' class="contain"') + '>' : '') +
        '</div><div class="gbody"><h4>' + x.n + '</h4><p>' + x.g + (x.since ? ' · منذ ' + x.since : '') + '</p></div></div>';
    }).join('');
    el.querySelectorAll('.gcover img').forEach(function (im) { im.addEventListener('error', function () { im.remove(); }); });
  }
  renderGames();

  function copyText(text, done) {
    function fb() { var t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) {} t.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fb); } else { fb(); }
  }
  var profiles = { steam: 'https://steamcommunity.com/id/Albashrawi/', discord: 'i.albashrawi' };
  var pEl = document.getElementById('profiles'), pHtml = '';
  if (profiles.steam) pHtml += '<a class="btn line" href="' + profiles.steam + '" target="_blank" rel="noopener">حسابي في Steam</a>';
  if (profiles.discord) pHtml += '<button type="button" class="btn line" id="dcBtn">Discord: ' + profiles.discord + ' · نسخ</button>';
  pEl.innerHTML = pHtml; pEl.hidden = !pHtml;
  var dc = document.getElementById('dcBtn');
  if (dc) dc.addEventListener('click', function () {
    var old = dc.textContent;
    copyText(profiles.discord, function () { dc.textContent = 'تم نسخ الاسم ✓'; setTimeout(function () { dc.textContent = old; }, 2000); });
  });

  /* ---- أتابعه الحين / بتابعه لاحقاً ----
     type: anime | series | movie
     title: الاسم اللي يظهر | note: سطر معلومات تحت الاسم
     search: الاسم بالإنجليزي لجلب الصورة وتحديث الحلقات تلقائياً (أو anilistId للأنمي / tvmazeId للمسلسل)
     wiki: اسم صفحة الفيلم في ويكيبيديا الإنجليزية لجلب البوستر
     coverOnly: true = أجلب الصورة فقط ولا أغيّر أرقام الحلقات (للأعمال المكتملة)
     watched: كم شاهدت | aired: عدد الحلقات المنزّلة | total: العدد الكلي | parts: عدد أجزاء سلسلة الأفلام
     status: 'planned' = بتابعه لاحقاً | since / until: سنة البداية والنهاية (بدون until = إلى الآن) */
  var watching = [
    /* أمثلة (شيل علامات التعليق وعدّل):
    { type: 'anime', title: 'اسم الأنمي', search: 'English name', watched: 3, since: '٢٠٢٦' },
    { type: 'series', title: 'اسم المسلسل', search: 'English name', watched: 0, status: 'planned' } */
  ];
  var done = [
    { type: 'series', title: 'Çukur', note: '٤ مواسم · ٢٠١٧ – ٢٠٢١', search: 'Cukur', coverOnly: true, watched: 131, aired: 131, total: 131 },
    { type: 'movie', title: 'The Maze Runner', note: 'ثلاثية أفلام · ٢٠١٤ – ٢٠١٨', parts: 3, watched: 3, wiki: 'The_Maze_Runner_(film)' },
    { type: 'anime', title: 'Solo Leveling', note: 'موسمان · ٢٠٢٤ و٢٠٢٥', search: 'Solo Leveling', coverOnly: true, watched: 25, aired: 25, total: 25 }
  ];
  var tLabel = { anime: 'أنمي', series: 'مسلسل', movie: 'فيلم' };
  var tvIcon = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>';
  var wFilter = 'all', onlyNew = false, live = { ok: 0, fail: 0, tried: 0 };
  function nf(n) { return Number(n).toLocaleString('ar-EG'); }
  function epWord(n, unit) {
    if (unit === 'أفلام') return n === 1 ? 'فيلم جديد' : (n === 2 ? 'فيلمان جديدان' : nf(n) + ' أفلام جديدة');
    if (n === 1) return 'حلقة جديدة'; if (n === 2) return 'حلقتان جديدتان'; if (n <= 10) return nf(n) + ' حلقات جديدة'; return nf(n) + ' حلقة جديدة';
  }
  function info(it) {
    var movie = it.type === 'movie', planned = it.status === 'planned', seq = (!movie || it.parts > 1) && !planned;
    var aired = !seq ? 1 : (movie ? it.parts : (it.aired || 0));
    var w = !seq ? (it.watched ? 1 : 0) : (it.watched || 0);
    var total = movie ? it.parts : it.total;
    var pct = aired > 0 ? Math.min(100, Math.round(w / aired * 100)) : 0;
    var fresh = (seq && aired > w) ? aired - w : 0;
    var isDone = !seq ? !!w : !!(total && w >= total && aired >= total);
    var status = planned ? 'بتابعه لاحقاً' : it.status === 'dropped' ? 'متوقف' : (!seq ? (w ? 'شاهدته' : 'قائمة المشاهدة') : (isDone ? 'خلصته' : 'أتابعه'));
    return { seq: seq, movie: movie, aired: aired, w: w, total: total, pct: pct, fresh: fresh, status: status, unit: movie ? 'أفلام' : 'حلقة' };
  }
  function card(it) {
    var i = info(it);
    var yrs = (it.since && it.status !== 'planned') ? ((!i.seq && i.movie) ? it.since : it.since + ' – ' + (it.until || 'الآن')) : '';
    return '<div class="w"><div class="poster">' + tvIcon + (it.cover ? '<img src="' + it.cover + '" alt="" referrerpolicy="no-referrer">' : '') + '</div><div>' +
      '<h4>' + it.title + '</h4>' + (it.note ? '<div class="wsub2">' + it.note + '</div>' : '') +
      '<div class="wmeta"><span>' + tLabel[it.type] + '</span><span>' + i.status + '</span>' + (yrs ? '<span class="yr">' + yrs + '</span>' : '') + '</div>' +
      (i.seq ? '<div class="pbar"><i style="width:' + i.pct + '%"></i></div><div class="wtxt"><span>شاهدت <b>' + nf(i.w) + '</b> من <b>' + nf(i.aired) + '</b> ' + i.unit + '</span><b>' + nf(i.pct) + '٪</b></div>' +
        ((!i.movie && i.total && i.total > i.aired) ? '<div class="wsub">باقي ' + nf(i.total - i.aired) + ' حلقة لم تنزل بعد</div>' : '') : '') +
      (i.fresh ? '<span class="newb">' + epWord(i.fresh, i.unit) + '</span>' : '') + '</div></div>';
  }
  function hideBrokenPosters(el) { el.querySelectorAll('.poster img').forEach(function (im) { im.addEventListener('error', function () { im.remove(); }); }); }
  function renderWatch() {
    var el = document.getElementById('watch'), freshCount = 0, html = '';
    watching.forEach(function (it) {
      var i = info(it); if (i.fresh) freshCount++;
      if (wFilter !== 'all' && it.type !== wFilter) return;
      if (onlyNew && !i.fresh) return;
      html += card(it);
    });
    document.querySelector('.wtools').hidden = !watching.length;
    el.innerHTML = html || '<p class="wnote">' + (watching.length ? 'ما فيه شيء يطابق هذا الفلتر.' : 'ما فيه شيء أتابعه الحين. أول ما أبدأ بمسلسل أو أنمي أو فيلم يظهر هنا مع تقدمي.') + '</p>';
    hideBrokenPosters(el);
    document.getElementById('wsum').textContent = freshCount ? 'فيه ' + nf(freshCount) + (freshCount === 1 ? ' عنصر فيه جديد' : ' عناصر فيها جديد') : 'ما فيه جديد حالياً';
    var d = document.getElementById('done'); d.innerHTML = done.map(card).join(''); hideBrokenPosters(d);
  }
  var wbtns = document.querySelectorAll('#wf button');
  wbtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var f = b.getAttribute('data-w');
      if (f === 'new') { onlyNew = !onlyNew; b.setAttribute('aria-pressed', onlyNew ? 'true' : 'false'); }
      else { wFilter = f; wbtns.forEach(function (x) { if (x.getAttribute('data-w') !== 'new') x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }
      renderWatch();
    });
  });

  /* التحديث التلقائي (يشتغل على استضافة عادية): AniList للأنمي، TVMaze للمسلسلات، ويكيبيديا لبوسترات الأفلام والألعاب */
  function getJSON(url, opts) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
    opts = opts || {}; if (ctl) opts.signal = ctl.signal;
    return fetch(url, opts).then(function (r) { clearTimeout(t); if (!r.ok) throw new Error('http'); return r.json(); });
  }
  function fetchWiki(title) {
    return getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title)).then(function (j) {
      var c = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
      return c ? { cover: c } : null;
    });
  }
  function fetchAnime(it) {
    var byId = !!it.anilistId;
    var q = 'query($v:' + (byId ? 'Int' : 'String') + '){Media(' + (byId ? 'id' : 'search') + ':$v,type:ANIME){episodes status nextAiringEpisode{episode} coverImage{large}}}';
    return getJSON('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ query: q, variables: { v: byId ? it.anilistId : it.search } }) })
      .then(function (j) {
        var m = j.data && j.data.Media; if (!m) return null;
        var aired = m.nextAiringEpisode ? m.nextAiringEpisode.episode - 1 : (m.status === 'NOT_YET_RELEASED' ? 0 : (m.episodes != null ? m.episodes : null));
        return { aired: aired, total: m.episodes || null, cover: m.coverImage && m.coverImage.large };
      });
  }
  function fetchSeries(it) {
    var url = it.tvmazeId ? 'https://api.tvmaze.com/shows/' + it.tvmazeId + '?embed=episodes' : 'https://api.tvmaze.com/singlesearch/shows?q=' + encodeURIComponent(it.search) + '&embed=episodes';
    return getJSON(url).then(function (j) {
      var eps = (j._embedded && j._embedded.episodes) || [], now = Date.now();
      var aired = eps.filter(function (e) { return e.airstamp && new Date(e.airstamp).getTime() <= now; }).length;
      return { aired: aired, total: eps.length || null, cover: j.image && (j.image.medium || j.image.original) };
    });
  }
  function setNote() {
    var n = document.getElementById('wnote');
    if (!live.tried) n.textContent = '';
    else if (live.ok) n.textContent = 'الصور والحلقات المنزّلة تتحدث تلقائياً من الإنترنت كل ما تفتح الصفحة.';
    else n.textContent = 'ما قدرت أحدّث من الإنترنت الحين، فالأرقام مدخلة يدوياً والصور ما تظهر. التحديث وجلب الصور يشتغلان لما يكون الموقع على استضافة عادية.';
  }
  function updateAll() {
    var jobs = watching.concat(done).filter(function (it) { return it.search || it.anilistId || it.tvmazeId || it.wiki; });
    live.tried = jobs.length;
    var all = jobs.map(function (it) {
      var p = it.wiki ? fetchWiki(it.wiki) : (it.type === 'anime' ? fetchAnime(it) : fetchSeries(it));
      return p.then(function (r) {
        if (!r) { live.fail++; return; }
        live.ok++; if (r.cover) it.cover = r.cover;
        if (!it.coverOnly && !it.wiki) { if (r.aired != null) it.aired = r.aired; if (r.total) it.total = r.total; }
      }).catch(function () { live.fail++; });
    });
    games.forEach(function (g) {
      if (g.wiki) all.push(fetchWiki(g.wiki).then(function (r) { if (r) { g.cover = r.cover; renderGames(); } }).catch(function () {}));
    });
    return Promise.all(all).then(function () { renderWatch(); setNote(); });
  }
  updateAll();
  renderWatch();
  document.getElementById('wnote').textContent = live.tried ? 'جارٍ تحديث الصور والحلقات من الإنترنت…' : '';
})();
</script>
</body>
</html>
