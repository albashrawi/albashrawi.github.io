            ["استيعاب المقروء", "يؤدي التعصب الرياضي إلى", "المنازعات والمشاحنات|زيادة الروح الرياضية|تطور الرياضة|الصحة النفسية", 0],
            ["استيعاب المقروء", "لكي نحد من التعصب الرياضي لابد من", "تشجيع فريق واحد|منع المباريات|إعطاء كل شخص حقه|زيادة أسعار التذاكر", 2],
            ["استيعاب المقروء", "من أهم شروط الدعوة الى الله", "معرفة الداعي إلى ما يدعو إليه|كثرة الكلام|الصوت العالي|الجدال", 0],
            ["استيعاب المقروء", "الهدف الأساسي من القراءة السريعة هو", "استيعاب الأفكار العامة بسرعة|حفظ الكلمات|استخراج القواعد|تصحيح الأخطاء", 0],
            ["استيعاب المقروء", "علاقة جملة (لأنها تتأثر بالعوامل الجوية) بما قبلها", "نتيجة|تعليل|توضيح|تأكيد", 1],
            ["استيعاب المقروء", "السبب الرئيسي لانتشار الصحاري هو", "قلة الأمطار|ارتفاع الحرارة|نشاط الرياح|تدخل الإنسان", 0],
            ["استيعاب المقروء", "يستفاد من النص أن الطاقة المتجددة تتميز بكونها", "نظيفة وغير مستنزفة|رخيصة جداً|سهلة النقل|متاحة بكل وقت", 0],
            ["استيعاب المقروء", "أفضل عنوان للنص يتحدث عن فوائد النوم الصحي هو", "أهمية النوم للجسم|أنواع الأحلام|أسباب الأرق|علاج الصداع", 0],
            ["استيعاب المقروء", "الفكرة الرئيسية للنص عن العسل الطبيعي هي", "فوائده العلاجية والغذائية|طريقة استخراجه|أنواع الخلايا|أسعاره بالسوق", 0],
            ["استيعاب المقروء", "المقصود بالتنمية المستدامة حسب السياق", "تلبية احتياجات الحاضر دون الإضرار بالمستقبل|زيادة الإنتاج الفوري|استنزاف الموارد|بناء المدن الجديدة", 0],
            ["استيعاب المقروء", "ما يعبر عنه الكاتب في ختام النص هو", "تفاؤل وحرص على المستقبل|يأس وإحباط|حزن عميق|غضب وتذمر", 0],
            ["استيعاب المقروء", "علاقة (فأصبح يهش النبات) بما قبلها هي", "نتيجة|تعليل|تأكيد|استدراك", 0],
            ["استيعاب المقروء", "الجهة المسؤولة عن حماية البيئة في النص هي", "الجهات المختصة والجمعيات|الأفراد وحدهم|الشركات التجارية|المدارس", 0],
            ["استيعاب المقروء", "أي الآتي يعتبر نتيجة مباشرة للتلوث البيئي؟", "تغير المناخ|زيادة الأمطار|خصوبة الأرض|نقاء الهواء", 0],
            ["استيعاب المقروء", "الهدف من النص الإرشادي الطبي هو", "توعية القارئ والوقاية من الأمراض|بيع الأدوية|شرح تشريح الجسم|تسلية القارئ", 0],
            ["استيعاب المقروء", "وفقاً للنص، متى تبدأ فترة الازحام المروري بالمدن الكبرى؟", "وقت الذروة صباحاً ومساءً|منتصف الليل|وقت الظهيرة|أيام الإجازات فقط", 0],
            ["استيعاب المقروء", "المشكلة التي يناقشها النص الاقتصادي هي", "التضخم المالي|زيادة الرواتب|وفرة السلع|انخفاض الضرائب", 0],
            ["استيعاب المقروء", "الحل المقترح للمشكلة المرورية في النص هو", "استخدام النقل الجماعي وتوسيع الطرق|منع السيارات|إغلاق الشوارع|زيادة الرسوم فقط", 0],
            ["استيعاب المقروء", "الكاتب يرى أن التكنولوجيا الحديثة سلاح ذو", "حدين|وجه واحد|فائدة مطلقة|ضرر مطلق", 0],
            ["استيعاب المقروء", "تدل كلمة (تكاتف) في السياق على", "التعاون والاتحاد|التباعد|المنافسة|الخلاف", 0],
            ["استيعاب المقروء", "ما هي نتيجة إهمال القراءة والاطلاع؟", "ضعف الحصيلة اللغوية والفكريَّة|زيادة الثقافة|سرعة البديهة|قوة الذاكرة", 0],
            ["استيعاب المقروء", "الصفة البارزة لشخصية القائد الناجح في النص هي", "الحكمة والعدل|الشدة المطلقة|السرعة بالعقوبات|التساهل التام", 0],
            ["استيعاب المقروء", "المقصود بالثورة الصناعية الرابعة في سياق النص", "الذكاء الاصطناعي والتقنيات الرقمية|المصانع البدائية|الزراعة التقليدية|صناعة السيارات القديمة", 0]
        ];

        let appState = {
            answers: {},
            categories: {},
            notes: {},
            currentIndex: 0,
            globalTime: 0
        };

        let filteredIndices = [];
        let timerInterval;
        let activeQuestionIndex = -1;

        const typeColors = {
            "تناظر لفظي": "text-blue-400 bg-blue-400/10 border-blue-400/20",
            "إكمال الجمل": "text-purple-400 bg-purple-400/10 border-purple-400/20",
            "الخطأ السياقي": "text-rose-400 bg-rose-400/10 border-rose-400/20",
            "استيعاب المقروء": "text-amber-400 bg-amber-400/10 border-amber-400/20"
        };

        function loadData() {
            const saved = localStorage.getItem('qudratStateFull');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                } catch(e) {
                    console.error("Error loading saved state", e);
                }
            }
        }

        function saveData() {
            try {
                localStorage.setItem('qudratStateFull', JSON.stringify(appState));
                updateStats();
            } catch(e) {
                console.error("Error saving state to localStorage", e);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                appState.globalTime++;
                if (activeQuestionIndex !== -1) {
                    if (!appState.answers[activeQuestionIndex]) {
                        appState.answers[activeQuestionIndex] = { timeSpent: 0 };
                    }
                    appState.answers[activeQuestionIndex].timeSpent = (appState.answers[activeQuestionIndex].timeSpent || 0) + 1;
                }
                updateTimeDisplay();
                if (appState.globalTime % 5 === 0) saveData(); 
            }, 1000);
        }

        function updateTimeDisplay() {
            const h = Math.floor(appState.globalTime / 3600).toString().padStart(2, '0');
            const m = Math.floor((appState.globalTime % 3600) / 60).toString().padStart(2, '0');
            const s = (appState.globalTime % 60).toString().padStart(2, '0');
            document.getElementById('stat-time').textContent = `${h}:${m}:${s}`;
        }

        function applyFilters() {
            const typeFilter = document.getElementById('filter-type').value;
            const statusFilter = document.getElementById('filter-status').value;
            const categoryFilter = document.getElementById('filter-category').value;

            filteredIndices = [];
            for (let i = 0; i < allQuestions.length; i++) {
                const q = allQuestions[i];
                const type = q[0];
                const answerObj = appState.answers[i];
                const category = appState.categories[i];

                if (typeFilter !== 'all' && type !== typeFilter) continue;
                if (statusFilter === 'unanswered' && (answerObj && answerObj.selectedOption !== undefined)) continue;
                if (statusFilter === 'correct' && (!answerObj || !answerObj.isCorrect)) continue;
                if (statusFilter === 'wrong' && (!answerObj || answerObj.isCorrect || answerObj.selectedOption === undefined)) continue;
                if (categoryFilter === 'uncategorized' && category) continue;
                if (categoryFilter !== 'all' && categoryFilter !== 'uncategorized' && category !== categoryFilter) continue;

                filteredIndices.push(i);
            }

            appState.currentIndex = 0;
            renderQuestion();
        }

        function updateStats() {
            let correct = 0;
            let wrong = 0;
            let answered = 0;

            for (let i = 0; i < allQuestions.length; i++) {
                const ans = appState.answers[i];
                if (ans && ans.selectedOption !== undefined) {
                    answered++;
                    if (ans.isCorrect) correct++;
                    else wrong++;
                }
            }

            document.getElementById('stat-correct').textContent = correct;
            document.getElementById('stat-wrong').textContent = wrong;
            
            const total = allQuestions.length;
            const progressPct = total === 0 ? 0 : Math.round((answered / total) * 100);
            
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            
            if (filteredIndices.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-box-open text-4xl mb-4 opacity-50"></i>
                        <p class="text-lg">لا توجد أسئلة تطابق الفلاتر الحالية.</p>
                        <button onclick="resetFilters()" class="mt-4 text-blue-400 hover:underline">مسح الفلاتر</button>
                    </div>`;
                activeQuestionIndex = -1;
                document.getElementById('stat-progress').textContent = `0/${allQuestions.length}`;
                return;
            }

            if (appState.currentIndex >= filteredIndices.length) appState.currentIndex = filteredIndices.length - 1;
            if (appState.currentIndex < 0) appState.currentIndex = 0;

            const realIndex = filteredIndices[appState.currentIndex];
            activeQuestionIndex = realIndex;
            const qData = allQuestions[realIndex];
            const type = qData[0];
            const text = qData[1];
            const options = qData[2].split('|');
            const correctIdx = qData[3];
            
            const state = appState.answers[realIndex] || {};
            const isAnswered = state.selectedOption !== undefined;
            const category = appState.categories[realIndex] || '';
            const note = appState.notes[realIndex] || '';

            document.getElementById('stat-progress').textContent = `${appState.currentIndex + 1} من ${filteredIndices.length}`;

            let html = `
                <div class="flex justify-between items-center mb-6">
                    <span class="px-3 py-1 text-sm rounded-full border ${typeColors[type] || 'text-slate-400 bg-slate-800'}">${type}</span>
                    <span class="text-slate-400 text-sm font-bold tracking-wider">السؤال رقم ${realIndex + 1} (من إجمالي ${allQuestions.length})</span>
                </div>
                
                <h2 class="text-2xl md:text-3xl font-bold leading-relaxed mb-8 text-white">${text}</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            `;

            const letters = ['أ', 'ب', 'ج', 'د'];
            options.forEach((opt, idx) => {
                let btnClass = "bg-slate-800 border-slate-600 text-slate-200 hover:bg-slate-700";
                let iconHtml = "";
                
                if (isAnswered) {
                    if (idx === correctIdx) {
                        btnClass = "bg-emerald-900/40 border-emerald-500 text-emerald-100 ring-1 ring-emerald-500";
                        iconHtml = `<i class="fa-solid fa-check text-emerald-400"></i>`;
                    } else if (idx === state.selectedOption) {
                        btnClass = "bg-rose-900/40 border-rose-500 text-rose-100";
                        iconHtml = `<i class="fa-solid fa-xmark text-rose-400"></i>`;
                    } else {
                        btnClass = "bg-slate-800/50 border-slate-700 text-slate-500 opacity-50";
                    }
                }

                html += `
                    <button 
                        onclick="selectOption(${realIndex}, ${idx}, ${correctIdx})" 
                        class="option-btn text-right p-4 rounded-xl border flex items-center justify-between gap-3 text-lg font-medium ${btnClass}"
                        ${isAnswered ? 'disabled' : ''}
                        id="opt-btn-${idx}"
                    >
                        <span class="flex items-center gap-3">
                            <span class="flex-shrink-0 w-8 h-8 rounded-lg bg-slate-700/50 flex items-center justify-center text-sm font-bold text-slate-400">${letters[idx]}</span>
                            <span>${opt}</span>
                        </span>
                        ${iconHtml}
                    </button>
                `;
            });

            html += `</div>`;

            if (isAnswered) {
                if (state.isCorrect) {
                    html += `
                        <div class="pop bg-emerald-900/20 border border-emerald-800/50 rounded-xl p-4 mb-8 flex items-start gap-3">
                            <i class="fa-solid fa-circle-check text-2xl text-emerald-400 shrink-0 mt-0.5"></i>
                            <div>
                                <h4 class="text-emerald-300 font-bold mb-1">صحيح ✅</h4>
                                <p class="text-emerald-200/70 text-sm">أحسنت! إجابتك صحيحة.</p>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="pop bg-rose-900/20 border border-rose-800/50 rounded-xl p-4 mb-8 flex items-start gap-3">
                            <i class="fa-solid fa-circle-xmark text-2xl text-rose-400 shrink-0 mt-0.5"></i>
                            <div>
                                <h4 class="text-rose-300 font-bold mb-1">خطأ ❌</h4>
                                <p class="text-rose-200/70 text-sm">الإجابة الصحيحة هي: <strong class="text-rose-100">${options[correctIdx]}</strong></p>
                            </div>
                        </div>
                    `;
                }
            }

            html += `
                <div class="bg-slate-900/50 rounded-xl p-5 border border-slate-800 mb-8">
                    <h4 class="text-sm text-slate-400 mb-3 font-bold">كيف تقيم مستواك في هذا السؤال؟</h4>
                    <div class="flex flex-wrap gap-3 mb-4">
                        <button onclick="setCategory(${realIndex}, 'know')" class="flex-1 py-2 px-3 rounded-lg border transition-colors ${category === 'know' ? 'bg-emerald-900/40 border-emerald-500 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                            ✓ أعرفها
                        </button>
                        <button onclick="setCategory(${realIndex}, 'review')" class="flex-1 py-2 px-3 rounded-lg border transition-colors ${category === 'review' ? 'bg-amber-900/40 border-amber-500 text-amber-400' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                            ⚠ تحتاج مراجعة
                        </button>
                        <button onclick="setCategory(${realIndex}, 'dontknow')" class="flex-1 py-2 px-3 rounded-lg border transition-colors ${category === 'dontknow' ? 'bg-rose-900/40 border-rose-500 text-rose-400' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}">
                            ✗ ما عرفتها
                        </button>
                    </div>
                    
                    <h4 class="text-sm text-slate-400 mb-2 font-bold mt-4">ملاحظاتك (تحفظ تلقائياً)</h4>
                    <textarea 
                        id="note-input" 
                        onblur="saveNote(${realIndex})" 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none resize-none h-20" 
                        placeholder="اكتب سبب خطئك هنا (مثال: استعجلت في قراءة الخيارات، نسيت معنى الكلمة...)"
                    >${note}</textarea>
                </div>
            `;

            html += `
                <div class="flex justify-between items-center mt-4">
                    <button onclick="prevQuestion()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition-colors disabled:opacity-30 flex items-center gap-2" ${appState.currentIndex === 0 ? 'disabled' : ''}>
                        <i class="fa-solid fa-arrow-right"></i> السابق
                    </button>
                    <button onclick="nextQuestion()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-lg shadow-blue-900/20 disabled:opacity-30 flex items-center gap-2" ${appState.currentIndex === filteredIndices.length - 1 ? 'disabled' : ''}>
                        التالي <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        function selectOption(qIndex, selectedIdx, correctIdx) {
            if (!appState.answers[qIndex]) {
                appState.answers[qIndex] = { timeSpent: 0 };
            }
            
            if (appState.answers[qIndex].selectedOption !== undefined) return;

            const isCorrect = selectedIdx === correctIdx;
            
            appState.answers[qIndex].selectedOption = selectedIdx;
            appState.answers[qIndex].isCorrect = isCorrect;
            
            saveData();
            renderQuestion();
        }

        function setCategory(qIndex, category) {
            if (appState.categories[qIndex] === category) {
                delete appState.categories[qIndex];
            } else {
                appState.categories[qIndex] = category;
            }
            saveData();
            renderQuestion();
        }

        function saveNote(qIndex) {
            const noteElem = document.getElementById('note-input');
            if (!noteElem) return;
            const text = noteElem.value.trim();
            if (text) {
                appState.notes[qIndex] = text;
            } else {
                delete appState.notes[qIndex];
            }
            saveData();
        }

        function nextQuestion() {
            if (appState.currentIndex < filteredIndices.length - 1) {
                appState.currentIndex++;
                saveData();
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (appState.currentIndex > 0) {
                appState.currentIndex--;
                saveData();
                renderQuestion();
            }
        }

        function resetFilters() {
            document.getElementById('filter-type').value = 'all';
            document.getElementById('filter-status').value = 'all';
            document.getElementById('filter-category').value = 'all';
            applyFilters();
        }

        document.getElementById('filter-type').addEventListener('change', applyFilters);
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('filter-category').addEventListener('change', applyFilters);

        document.getElementById('btn-reset').addEventListener('click', () => {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in";
            overlay.innerHTML = `
                <div class="bg-cardBg p-6 rounded-2xl max-w-md w-full shadow-2xl border border-slate-700 text-center pop">
                    <div class="w-16 h-16 bg-rose-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-rose-500 text-2xl">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">تأكيد مسح البيانات</h3>
                    <p class="text-slate-400 mb-6">هل أنت متأكد أنك تريد تصفير كل التقدم؟ لا يمكن التراجع عن هذا الإجراء.</p>
                    <div class="flex gap-3">
                        <button id="confirm-reset" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg font-bold transition-colors">نعم، امسح كل شيء</button>
                        <button id="cancel-reset" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg transition-colors">إلغاء</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            document.getElementById('confirm-reset').onclick = () => {
                localStorage.removeItem('qudratStateFull');
                appState = { answers: {}, categories: {}, notes: {}, currentIndex: 0, globalTime: 0 };
                updateStats();
                applyFilters();
                document.body.removeChild(overlay);
            };
            document.getElementById('cancel-reset').onclick = () => {
                document.body.removeChild(overlay);
            };
        });

        document.getElementById('btn-export').addEventListener('click', async () => {
            const json = JSON.stringify(appState);
            try {
                const dl = window.claude && await window.claude.use('downloads');
                if (dl) { await dl.save({ filename: 'qudrat_full_progress.json', data: json }); return; }
            } catch (err) { if (err && err.code === 'declined') return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(json);
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "qudrat_full_progress.json");
            document.body.appendChild(a); a.click(); a.remove();
        });

        document.getElementById('file-import').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && typeof importedState === 'object') {
                        appState = { ...appState, ...importedState };
                        saveData();
                        applyFilters();
                        
                        const toast = document.createElement('div');
                        toast.className = "fixed bottom-4 right-4 bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in";
                        toast.innerHTML = '<i class="fa-solid fa-check mr-2"></i> تم استيراد وحفظ البيانات في المتصفح بنجاح';
                        document.body.appendChild(toast);
                        setTimeout(() => { toast.remove(); }, 3000);
                    }
                } catch (err) {
                    console.error("Error parsing JSON file", err);
                    const toast = document.createElement('div');
                    toast.className = "fixed bottom-4 right-4 bg-rose-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in";
                    toast.innerHTML = '<i class="fa-solid fa-xmark mr-2"></i> حدث خطأ أثناء استيراد الملف';
                    document.body.appendChild(toast);
                    setTimeout(() => { toast.remove(); }, 3000);
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        window.onload = () => {
            loadData();
            updateStats();
            applyFilters();
            startTimer();
        };
    </script>
</body>
</html>
